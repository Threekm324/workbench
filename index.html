<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#EFF1F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="双轨工作台">
<title>双轨学习工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect x='6' y='9' width='18' height='13' rx='2.5' fill='%23171A20'/%3E%3Ccircle cx='15' cy='15.5' r='3.2' fill='%23EFF1F4'/%3E%3C/svg%3E">
<!--
DIRECTION CONTRACT — PCB·FPGA 双轨学习工作台
THESIS: 一份把"PCB 轨 + FPGA/IC 轨 + 复旦考研主线 + 时间阶段"一一对应的执行驾驶舱；拒绝通用任务软件的通用列表，首屏即呈现"今天做什么 + 正在提升什么"。
OWN-WORLD: 冷灰台面 #EFF1F4、白卡片、铜色 #C4551C（PCB 轨）与深青 #0F766E（IC 轨）双轨道色贯穿进度与标记；等宽字体只用于时长与数字；全部图标为同一种 1.5px 描边手绘 SVG。
STORY: 用户每天打开 → 顶栏时间轴自动定位当前阶段 → 今日任务卡给出当日清单与时长 → 双轨面板逐项打卡 → 右侧能力图谱实时反馈"这些任务在喂哪些能力"；大三起考研主线接管节奏，双轨降级为保温与谈资积累。
FIRST VIEWPORT: 顶栏（名称+总进度环）→ 九阶段时间轴 chips（带进度）→ 主栅格左列顺序：课内路线学期卡 → 考研·课内事务 → 今日任务 → PCB/IC 双轨面板 → 验收标准；右列能力图谱与资源。
FORM: 个人仪表盘（Operate），紧凑布局，chips 直排；主行动 = 勾选打卡。
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<style>
  :root {
    --ground:#EFF1F4; --panel:#FFFFFF;     --ink:#171A20; --ink-2:#454C59; --ink-3:#5C6474;
    --line:#DCE0E7; --line-2:#EDEFF3;
    --pcb:#C4551C; --pcb-bg:#FBF0E6; --pcb-soft:#F7E4D3;
    --ic:#0F766E; --ic-bg:#E9F3F1; --ic-soft:#D8E9E6;
    --focus:#0F766E; --sel-bg:#D8E9E6;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"Courier New",monospace;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --r-lg:14px; --r-md:10px; --r-sm:6px;
    --shadow:0 1px 2px rgba(23,26,32,.05),0 6px 18px rgba(23,26,32,.06);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scrollbar-color:#C4C9D2 var(--ground); }
  body {
    background:var(--ground); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  }
  ::selection { background:var(--sel-bg); }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#C4C9D2; border-radius:5px; border:2px solid var(--ground); }
  ::-webkit-scrollbar-track { background:transparent; }
  a { color:var(--ink); text-decoration-color:var(--line); text-underline-offset:3px; }
  a:hover { text-decoration-color:var(--focus); color:var(--focus); }
  :focus-visible { outline:2px solid var(--focus); outline-offset:2px; border-radius:4px; }
  .wrap { max-width:1380px; margin:0 auto; padding:0 24px 64px; }

  /* ---------- top bar ---------- */
  header {
    position:sticky; top:0; z-index:50; background:rgba(239,241,244,.92);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .bar { max-width:1380px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:18px; }
  .brand { display:flex; align-items:center; gap:11px; min-width:0; }
  .brand svg { flex:none; }
  .brand h1 { font-size:18px; font-weight:800; letter-spacing:.01em; white-space:nowrap; }
  .brand .sub { font-size:12px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .bar-right { margin-left:auto; display:flex; align-items:center; gap:16px; }
  .today-date { font-family:var(--mono); font-size:12.5px; color:var(--ink-2); white-space:nowrap; }
  .total { display:flex; align-items:center; gap:10px; white-space:nowrap; }
  .total .nums { text-align:right; }
  .total .pct { font-family:var(--mono); font-size:16px; font-weight:700; line-height:1; }
  .total .lbl { font-size:11px; color:var(--ink-3); }

  /* ---------- timeline ---------- */
  .timeline { display:flex; gap:10px; overflow-x:auto; padding:16px 24px 4px; scrollbar-width:thin; }
  .chip {
    flex:none; display:flex; flex-direction:column; gap:7px; min-width:148px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r-md);
    padding:10px 13px 9px; cursor:pointer; text-align:left; font-family:inherit; font-size:12px;
    transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }
  .chip:hover { border-color:#B7BEC9; transform:translateY(-1px); }
  .chip .nm { font-weight:700; font-size:12.5px; letter-spacing:.01em; }
  .chip .rg { font-family:var(--mono); font-size:10.5px; color:var(--ink-3); }
  .chip .pb { height:4px; border-radius:2px; background:var(--line-2); overflow:hidden; }
  .chip .pb i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--pcb),var(--ic)); border-radius:2px; }
  .chip.cur { background:var(--ink); border-color:var(--ink); }
  .chip.cur .nm { color:#fff; }
  .chip.cur .rg { color:#AEB4BF; }
  .chip.cur .pb { background:rgba(255,255,255,.14); }
  .chip.cur .pb i { background:linear-gradient(90deg,#E08B5A,var(--ic)); }
  .chip .pctl { display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-3); }
  .chip.cur .pctl { color:#AEB4BF; }
  .chip .pctl b { font-family:var(--mono); font-weight:600; }

  /* ---------- layout ---------- */
  .grid { display:grid; grid-template-columns:minmax(0,1fr) 352px; gap:18px; margin-top:18px; align-items:start; }
  .col { display:flex; flex-direction:column; gap:18px; min-width:0; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden; }
  .panel > .ph { padding:14px 18px 0; }
  .panel > .pb { padding:12px 18px 18px; }
  .ph h2 { font-size:16px; font-weight:800; letter-spacing:.01em; }
  .ph .phsub { font-size:12px; color:var(--ink-3); margin-top:2px; }

  /* today */
  .today .ph { display:flex; align-items:baseline; gap:10px; }
  .today .sum { margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--ink-2); white-space:nowrap; }
  .t-grp { padding:8px 0 2px; }
  .t-grp + .t-grp { border-top:1px dashed var(--line); margin-top:10px; padding-top:13px; }
  .g-t { font-size:11px; font-weight:700; color:var(--ink-3); letter-spacing:.06em; margin-bottom:3px; }
  .t-item { display:flex; gap:11px; padding:9px 0; border-top:1px solid var(--line-2); align-items:flex-start; }
  .t-item:first-of-type { border-top:none; }
  .t-item .tt { font-weight:600; font-size:14px; }
  .t-item .tm { font-family:var(--mono); font-size:11.5px; color:var(--ink-3); margin-top:1px; }
  .t-item .tags { margin-top:5px; }

  /* checkbox tasks */
  .task { display:flex; gap:11px; padding:10px 0; border-top:1px solid var(--line-2); align-items:flex-start; }
  .task:first-of-type { border-top:none; }
  .ck { flex:none; margin-top:1px; }
  .ck input { position:absolute; opacity:0; pointer-events:none; }
  .ck .box {
    display:inline-flex; width:19px; height:19px; border:1.5px solid #B9C0CA; border-radius:5px;
    align-items:center; justify-content:center; cursor:pointer; background:#fff;
    transition:all .16s ease; color:transparent;
  }
  .ck input:focus-visible + .box { outline:2px solid var(--focus); outline-offset:2px; }
  .ck input:checked + .box { background:var(--ink); border-color:var(--ink); color:#fff; }
  .task[data-track="pcb"] .ck input:checked + .box { background:var(--pcb); border-color:var(--pcb); }
  .task[data-track="ic"] .ck input:checked + .box { background:var(--ic); border-color:var(--ic); }
  .ck .box svg { width:12px; height:12px; }
  .t-body { min-width:0; flex:1; }
  .t-body .tt { font-weight:600; font-size:14px; }
  .t-body .tt.on { text-decoration:line-through; color:var(--ink-3); text-decoration-color:#B7BEC9; }
  .t-body .tm { font-family:var(--mono); font-size:11.5px; color:var(--ink-3); margin-top:2px; }
  .tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .tag { font-size:11px; color:var(--ink-2); background:var(--line-2); border-radius:999px; padding:2px 9px; font-weight:500; }
  .tag.pcb { background:var(--pcb-soft); color:#8A3A12; }
  .tag.ic { background:var(--ic-soft); color:#0A5A54; }

  /* collapsible per-task guidance */
  .t-more { margin-top:7px; }
  .t-more > summary {
    list-style:none; cursor:pointer; user-select:none;
    display:inline-flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:600; color:var(--ink-3);
    border-radius:5px; transition:color .15s ease;
  }
  .t-more > summary::-webkit-details-marker { display:none; }
  .t-more > summary:hover { color:var(--focus); }
  .t-more[open] > summary { color:var(--focus); }
  .t-more .chev { width:9px; height:9px; transition:transform .18s ease; }
  .t-more[open] .chev { transform:rotate(180deg); }
  .more-body {
    margin:8px 0 2px; background:#F6F8FA; border:1px solid var(--line-2);
    border-radius:8px; padding:10px 12px 11px;
  }
  .more-body .md { font-size:12.5px; color:var(--ink-2); line-height:1.65; white-space:pre-line; }
  .more-body .ml { list-style:none; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); display:flex; flex-direction:column; gap:4px; }
  .more-body .ml a { font-size:12px; font-weight:600; }
  .more-body .ml .rk { font-size:11px; color:var(--ink-3); margin-left:7px; }

  /* dual track panels */
  .tracks { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .track { background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); overflow:hidden; }
  .track.pcb { border-top:3px solid var(--pcb); }
  .track.ic { border-top:3px solid var(--ic); }
  .track > .ph { padding:14px 18px 0; display:flex; align-items:baseline; gap:10px; }
  .track > .pb { padding:6px 18px 16px; }
  .track h2 { font-size:16px; font-weight:800; }
  .track .prog { margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--ink-2); white-space:nowrap; }
  .tbar { height:4px; border-radius:2px; background:var(--line-2); overflow:hidden; margin:10px 18px 0; }
  .tbar i { display:block; height:100%; width:100%; transform:scaleX(0); transform-origin:left; border-radius:2px; transition:transform .4s cubic-bezier(.22,1,.36,1); }
  .track.pcb .tbar i { background:var(--pcb); }
  .track.ic .tbar i { background:var(--ic); }

  /* common strip */
  .common { background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); }
  .common > .ph { padding:13px 18px 0; display:flex; align-items:baseline; gap:10px; }
  .common > .pb { padding:6px 18px 14px; display:grid; grid-template-columns:1fr 1fr; gap:0 24px; }
  .common .ph h2 { font-size:14.5px; }
  .common .ph .phsub { font-size:11.5px; }

  /* course map (课内路线) */
  .cm-strip { display:flex; gap:10px; overflow-x:auto; padding:10px 18px 16px; scrollbar-width:thin; }
  .cm-card {
    flex:none; width:242px; display:flex; flex-direction:column; gap:6px; text-align:left;
    font-family:inherit; font-size:12px; color:var(--ink);
    background:#F8FAFB; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px 11px; cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .cm-card:hover { border-color:#B7BEC9; transform:translateY(-1px); }
  .cm-card.cur { background:var(--ink); border-color:var(--ink); }
  .cm-sem { font-size:12.5px; font-weight:800; letter-spacing:.01em; }
  .cm-rg { font-family:var(--mono); font-size:10.5px; color:var(--ink-3); }
  .cm-row { display:flex; flex-direction:column; gap:1px; padding-top:5px; border-top:1px solid var(--line-2); }
  .cm-row:first-of-type { margin-top:2px; }
  .cn { font-size:11.5px; font-weight:600; color:var(--ink-2); line-height:1.4; }
  .cd { font-size:10.5px; color:var(--ink-3); line-height:1.4; }
  .cm-line { display:flex; gap:6px; align-items:flex-start; padding-top:6px; border-top:1px dashed var(--line); font-size:10.5px; color:var(--ink-3); line-height:1.5; }
  .lb { flex:none; font-style:normal; font-size:9.5px; font-weight:700; border-radius:4px; padding:1px 5px; margin-top:1px; }
  .lb-pick { background:var(--pcb-soft); color:#8A3A12; }
  .lb-exam { background:var(--ic-soft); color:#0A5A54; }
  .cm-card.cur .cm-sem, .cm-card.cur .cn { color:#fff; }
  .cm-card.cur .cm-rg, .cm-card.cur .cd, .cm-card.cur .cm-line { color:#AEB4BF; }
  .cm-card.cur .cm-row { border-top-color:rgba(255,255,255,.14); }
  .cm-card.cur .cm-line { border-top-color:rgba(255,255,255,.14); }
  .cm-card.cur .lb-pick { background:rgba(224,139,90,.28); color:#F0B48C; }
  .cm-card.cur .lb-exam { background:rgba(15,118,110,.4); color:#7FD1C8; }

  /* milestones */
  .ms { padding:4px 18px 16px; }
  .ms-item { display:flex; gap:10px; padding:7px 0; align-items:flex-start; }
  .ms-item .tt { font-size:13px; }
  .ms-item .n { font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-top:3px; }

  /* abilities */
  .abil-group { display:flex; align-items:center; gap:7px; padding:10px 0 2px; font-size:11px; font-weight:700; letter-spacing:.07em; color:var(--ink-3); }
  .abil-group::before { content:""; width:6px; height:6px; border-radius:50%; flex:none; }
  .abil-group.ic::before { background:var(--ic); }
  .abil-group.pcb::before { background:var(--pcb); }
  .abil-group.common::before { background:var(--ink-3); }
  .ab { display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:center; padding:7px 0; border-top:1px solid var(--line-2); }
  .abil-group + .ab { border-top:none; }
  .ab.zero { opacity:.55; }
  .ab .an { font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:7px; }
  .ab .an::before { content:""; width:6px; height:6px; border-radius:50%; }
  .ab.pcb .an::before { background:var(--pcb); }
  .ab.ic .an::before { background:var(--ic); }
  .ab.common .an::before { background:var(--ink-3); }
  .ab .ap { font-family:var(--mono); font-size:11px; color:var(--ink-3); }
  .ab .abar { grid-column:1 / 3; height:3px; border-radius:2px; background:var(--line-2); overflow:hidden; margin-top:4px; }
  .ab .abar i { display:block; height:100%; width:100%; transform:scaleX(0); transform-origin:left; border-radius:2px; background:var(--ink-2); transition:transform .4s cubic-bezier(.22,1,.36,1); }
  .ab.pcb .abar i { background:var(--pcb); }
  .ab.ic .abar i { background:var(--ic); }

  /* resources */
  .res { padding:4px 18px 16px; }
  .res-item { display:flex; align-items:baseline; gap:9px; padding:6.5px 0; border-top:1px solid var(--line-2); }
  .res-item:first-of-type { border-top:none; }
  .res-item .rn { font-size:12.5px; font-weight:600; }
  .res-item .ru { margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
  .res-item a .rn:hover { color:var(--focus); }

  footer { margin-top:26px; padding-top:14px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-3); }
  footer .f-mono { font-family:var(--mono); }
  .f-sync { display:flex; gap:8px; flex-wrap:wrap; }
  .btn-reset {
    font-family:inherit; font-size:11.5px; color:var(--ink-3); background:none; border:1px solid var(--line);
    padding:3px 10px; border-radius:6px; cursor:pointer;
  }
  .btn-reset:hover { color:#B33A3A; border-color:#D8A5A5; }

  .empty { padding:18px; font-size:13px; color:var(--ink-3); }

  /* animations */
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .panel, .track, .common { animation:rise .35s cubic-bezier(.22,1,.36,1) both; }
  .tracks .track:nth-child(1) { animation-delay:.04s; }
  .tracks .track:nth-child(2) { animation-delay:.09s; }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
  }

  @media (max-width:1120px) {
    .grid { grid-template-columns:1fr; }
    .tracks { grid-template-columns:1fr; }
    .common > .pb { grid-template-columns:1fr; }
    .bar { flex-wrap:wrap; }
  }
  @media (max-width:640px) {
    body { font-size:14px; }
    .wrap { padding:0 14px 48px; }
    .timeline { padding:12px 14px 4px; }
    .cm-strip { padding:10px 14px 12px; }
    .cm-card { width:216px; }
    .today-date { display:none; }
    .total .lbl { display:none; }
    .res-item .ru { max-width:90px; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <rect x="6" y="9" width="18" height="13" rx="2.5" stroke="#C4551C" stroke-width="1.6"/>
        <rect x="6" y="9" width="18" height="13" rx="2.5" stroke="#0F766E" stroke-width="1.6" stroke-dasharray="24 52"/>
        <circle cx="15" cy="15.5" r="3.2" fill="#171A20"/>
        <path d="M6 12.5H2.5M6 17.5H2.5M6 22.5H2.5M24 12.5h3.5M24 17.5h3.5M24 22.5h3.5" stroke="#171A20" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M12 4.5v2M15 4.5v2M18 4.5v2M12 25.5v2M15 25.5v2M18 25.5v2" stroke="#171A20" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>双轨学习工作台</h1>
        <div class="sub">PCB 轨 · FPGA/IC 轨 · 复旦统考主线 · 本校保底 · 2026–2029 执行计划</div>
      </div>
    </div>
    <div class="bar-right">
      <div class="today-date" id="todayDate"></div>
      <div class="total">
        <div class="nums"><div class="pct" id="totalPct">0%</div><div class="lbl" id="totalLbl">总进度</div></div>
        <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
          <circle cx="19" cy="19" r="16" fill="none" stroke="#DCE0E7" stroke-width="4"/>
          <circle id="totalRing" cx="19" cy="19" r="16" fill="none" stroke="#171A20" stroke-width="4"
            stroke-linecap="round" transform="rotate(-90 19 19)" stroke-dasharray="100.5 100.5" stroke-dashoffset="100.5"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="timeline" id="timeline" role="tablist" aria-label="学习阶段"></div>
</header>

<main class="wrap">
  <div class="grid">
    <div class="col">
      <section class="panel coursemap" aria-labelledby="h-cm">
        <div class="ph">
          <h2 id="h-cm">课内路线</h2>
          <span class="phsub">学期重心 · 选课决策 · 考研节点 · 点卡片跳转阶段</span>
        </div>
        <div class="cm-strip" id="cmStrip"></div>
      </section>

      <section class="common" id="commonSec">
        <div class="ph"><h2>考研 · 课内事务</h2><span class="phsub" id="commonSub"></span></div>
        <div class="pb" id="commonList"></div>
      </section>

/* ================= 状态 ================= */
const LS_KEY = "dw_workbench_v1";
const state = { phaseOverride: null, done: {} };

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      state.phaseOverride = s.phaseOverride || null;
      state.done = s.done || {};
    }
  } catch (e) { /* 损坏则重置 */ }
  PHASES.forEach(p => p.tracks.ic.concat(p.tracks.pcb).concat(p.common).forEach(t => {
    if (t.done && state.done[p.id + "/" + t.id] === undefined) state.done[p.id + "/" + t.id] = true;
  }));
}
function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify({ phaseOverride: state.phaseOverride, done: state.done }));
}
function isDone(p, t) { return !!state.done[p.id + "/" + t.id]; }
function setDone(p, t, v) { state.done[p.id + "/" + t.id] = v; saveState(); }

/* ================= 工具 ================= */
const fmt = n => n >= 60 ? Math.floor(n/60) + "h" + (n%60 ? String(n%60).padStart(2,"0") + "m" : "") : n + "m";
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const todayStr = () => new Date().toISOString().slice(0,10);

function currentPhase() {
  if (state.phaseOverride) { const p = PHASES.find(x => x.id === state.phaseOverride); if (p) return p; }
  const t = todayStr();
  const found = PHASES.find(p => t >= p.start && t <= p.end);
  return found || PHASES[PHASES.length - 1];
}
function allTasks(p) { return p.tracks.ic.concat(p.tracks.pcb).concat(p.common); }
function phaseDone(p) { return allTasks(p).filter(t => isDone(p,t)).length; }
function phaseTotal(p) { return allTasks(p).length; }
function phasePct(p) { const n = phaseTotal(p); return n ? Math.round(phaseDone(p)/n*100) : 0; }
function trackDone(p, tr) { return p.tracks[tr].filter(t => isDone(p,t)).length; }
function trackTotal(p, tr) { return p.tracks[tr].length; }

/* ================= 渲染 ================= */
const $ = id => document.getElementById(id);
const CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2 5 8.7 9.5 3.5"/></svg>';

function tagChip(t, base) {
  return (t.a || []).map(a => `<span class="tag ${base}">${esc(ABILITIES[a].name)}</span>`).join("");
}

const CHEV = '<svg class="chev" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5 5 6.5 8 3.5"/></svg>';

function collapseHtml(t) {
  const res = (t.rr || []).map(k => RES[k]).filter(Boolean)
    .map(r => `<li>${r.u
      ? `<a href="${r.u}" target="_blank" rel="noopener">${esc(r.n)}</a>`
      : `<strong class="rt">${esc(r.n)}</strong>`}${r.k ? `<span class="rk">${esc(r.k)}</span>` : ""}</li>`).join("");
  if (!t.d && !res) return "";
  return `<details class="t-more"><summary>${CHEV}说明与资源</summary><div class="more-body">${t.d ? `<p class="md">${esc(t.d)}</p>` : ""}${res ? `<ul class="ml">${res}</ul>` : ""}</div></details>`;
}

function taskRow(p, t, track) {
  const key = p.id + "/" + t.id, d = isDone(p, t);
  const base = track === "pcb" ? "pcb" : "ic";
  const mins = t.m ? `<div class="tm">${t.m}m</div>` : "";
  return `<div class="task" data-track="${track}">
    <label class="ck"><input type="checkbox" data-key="${key}" ${d ? "checked" : ""}><span class="box">${CHECK}</span></label>
    <div class="t-body"><div class="tt ${d ? "on" : ""}">${esc(t.t)}</div>${mins}<div class="tags">${tagChip(t, base)}</div>${collapseHtml(t)}</div>
  </div>`;
}

function renderToday(p) {
  const daily = allTasks(p).filter(t => t.daily);
  const sprint = allTasks(p).filter(t => t.once && !isDone(p, t));
  const itemHtml = t => {
    const base = t.a && t.a[0] && ABILITIES[t.a[0]].group === "pcb" ? "pcb" : "ic";
    const d = isDone(p, t);
    const when = t.daily ? "每日" : "一次性";
    return `<div class="t-item"><label class="ck"><input type="checkbox" data-key="${p.id}/${t.id}" ${d ? "checked" : ""}><span class="box">${CHECK}</span></label>
      <div class="t-body"><div class="tt ${d ? "on" : ""}">${esc(t.t)}</div><div class="tm">${when} · ${t.m ? t.m + "m" : ""}</div>
      <div class="tags">${tagChip(t, base)}</div>${collapseHtml(t)}</div></div>`;
  };
  let html = "";
  if (daily.length) html += `<div class="t-grp"><div class="g-t">每日节奏</div>${daily.map(itemHtml).join("")}</div>`;
  if (sprint.length) html += `<div class="t-grp"><div class="g-t">冲刺项 · 本阶段清掉</div>${sprint.map(itemHtml).join("")}</div>`;
  $("todayList").innerHTML = html || `<div class="empty">当前阶段没有按日排布的任务，直接在下方双轨面板里打卡。</div>`;
  const leftDaily = daily.filter(t => !isDone(p, t));
  const mins = leftDaily.reduce((s, t) => s + (t.m || 0), 0);
  $("todaySum").textContent = mins ? `每日 ${leftDaily.length} 项 · 约 ${fmt(mins)}` + (sprint.length ? ` · 冲刺 ${sprint.length}` : "") : "每日任务全清 ✓";
  $("todayPhase").textContent = p.name + " · " + p.note;
}

function renderTrack(p, track, el, bar, prog, countWrap) {
  const html = p.tracks[track].map(t => taskRow(p, t, track)).join("") ||
    `<div class="empty">本阶段此轨无任务。</div>`;
  $(el).innerHTML = html;
  const n = trackTotal(p, track), d = trackDone(p, track);
  $(bar).style.transform = n ? `scaleX(${d/n})` : "scaleX(0)";
  $(prog).textContent = n ? `${d}/${n} · ${Math.round(d/n*100)}%` : "—";
}

function renderCommon(p) {
  $("commonSub").textContent = p.name + " · 考研与课内事务";
  $("commonList").innerHTML = p.common.map(t => {
    const d = isDone(p, t);
    return `<div class="task" data-track="ic">
      <label class="ck"><input type="checkbox" data-key="${p.id}/${t.id}" ${d ? "checked" : ""}><span class="box">${CHECK}</span></label>
      <div class="t-body"><div class="tt ${d ? "on" : ""}">${esc(t.t)}</div><div class="tags">${tagChip(t, "ic")}</div>${collapseHtml(t)}</div>
    </div>`;
  }).join("") || `<div class="empty">本阶段无额外事务，主线见上方课内路线与今日任务。</div>`;
}

function renderCourseMap() {
  const cur = currentPhase().id;
  $("cmStrip").innerHTML = COURSEPLAN.map(c => {
    const on = c.phase === cur;
    const rows = c.focus.map(f =>
      `<div class="cm-row"><span class="cn">${esc(f[0])}</span><span class="cd">${esc(f[1])}</span></div>`).join("");
    return `<button class="cm-card${on ? " cur" : ""}" data-phase="${c.phase}" type="button" aria-pressed="${on}">
      <span class="cm-sem">${esc(c.sem)}${on ? " · 当前" : ""}</span>
      <span class="cm-rg">${esc(c.range)}</span>
      ${rows}
      <div class="cm-line"><i class="lb lb-pick">选课</i><span>${esc(c.picks)}</span></div>
      <div class="cm-line"><i class="lb lb-exam">考研</i><span>${esc(c.exam)}</span></div>
    </button>`;
  }).join("");
}

function renderMilestones(p) {
  $("msSub").textContent = p.name + " · 达标即算该阶段完成";
  $("msList").innerHTML = p.milestones.map((m, i) => {
    const key = "ms:" + p.id + ":" + i, d = isDone(p, {id: "ms" + i});
    const ck = !!state.done[key];
    return `<div class="ms-item">
      <label class="ck"><input type="checkbox" data-key="${key}" ${ck ? "checked" : ""}><span class="box">${CHECK}</span></label>
      <div class="t-body"><div class="tt ${ck ? "on" : ""}">${esc(m)}</div><div class="n">验收标准 ${i+1} · ${p.id.toUpperCase()}</div></div>
    </div>`;
  }).join("");

function renderResources(p) {
  $("resSub").textContent = p.name;
  $("resList").innerHTML = p.resources.map(r =>
    `<div class="res-item"><a href="${r.url}" target="_blank" rel="noopener"><span class="rn">${esc(r.name)}</span></a><span class="ru">${esc(r.note)}</span></div>`
  ).join("");
}

function renderAbilities() {
  const rows = Object.entries(ABILITIES).map(([id, ab]) => {
    let total = 0, done = 0;
    PHASES.forEach(p => allTasks(p).forEach(t => {
      if ((t.a || []).includes(id)) { total++; if (isDone(p, t)) done++; }
    }));
    const pct = total ? Math.round(done/total*100) : 0;
    return { ...ab, id, total, done, pct };
  });
  const order = { ic: 0, pcb: 1, common: 2 };
  rows.sort((x, y) => order[x.group] - order[y.group] || y.pct - x.pct);
  const labels = { ic: "IC 轨能力", pcb: "PCB 轨能力", common: "通用能力" };
  let last = "";
  $("abList").innerHTML = rows.map(r => {
    let head = "";
    if (r.group !== last) { last = r.group; head = `<div class="abil-group ${r.group}">${labels[r.group]}</div>`; }
    const bar = r.done
      ? `<div class="abar"><i style="transform:scaleX(${r.pct/100})"></i></div>`
      : "";
    return head + `<div class="ab ${r.group} ${r.done ? "" : "zero"}"><div class="an">${esc(r.name)}</div>
      <div class="ap">${r.done}/${r.total} · ${r.pct}%</div>${bar}</div>`;
  }).join("");
}

function renderTimeline() {
  const cur = currentPhase();
  $("timeline").innerHTML = PHASES.map(p => {
    const pct = phasePct(p), on = p.id === cur.id;
    return `<button class="chip ${on ? "cur" : ""}" data-phase="${p.id}" role="tab" aria-selected="${on}">
      <span class="nm">${esc(p.name)}</span><span class="rg">${esc(p.range)}</span>
      <span class="pb"><i data-bar="${p.id}"></i></span>
      <span class="pctl"><span>${on ? "当前" : "阶段进度"}</span><b>${pct}%</b></span>
    </button>`;
  }).join("");
  PHASES.forEach(p => {
    const el = document.querySelector(`[data-bar="${p.id}"]`);
    if (el) el.style.width = phasePct(p) + "%";
  });
}

function renderTotals() {
  let total = 0, done = 0;
  PHASES.forEach(p => { total += phaseTotal(p); done += phaseDone(p); });
  const pct = total ? Math.round(done/total*100) : 0;
  $("totalPct").textContent = pct + "%";
  $("totalLbl").textContent = `${done}/${total} 任务`;
  const ring = $("totalRing"), c = 100.5;
  ring.style.transition = "stroke-dashoffset .8s cubic-bezier(.22,1,.36,1)";
  requestAnimationFrame(() => requestAnimationFrame(() => { ring.style.strokeDashoffset = c - c * pct/100; }));
}

function render() {
  const p = currentPhase();
  $("todayDate").textContent = todayStr();
  renderTimeline();
  renderCourseMap();
  renderToday(p);
  renderTrack(p, "ic", "icList", "icBar", "icProg");
  renderTrack(p, "pcb", "pcbList", "pcbBar", "pcbProg");
  renderCommon(p);
  renderMilestones(p);
  renderResources(p);
  renderAbilities();
  renderTotals();
  document.title = `双轨工作台 · ${p.name}`;
}

/* ================= 交互 ================= */
document.addEventListener("change", e => {
  const cb = e.target.closest("input[type=checkbox][data-key]");
  if (!cb) return;
  const key = cb.dataset.key;
  const [pid, tid] = key.split("/");
  if (key.startsWith("ms:")) {
    state.done[key] = cb.checked;
    saveState();
  } else {
    const p = PHASES.find(x => x.id === pid);
    const t = allTasks(p).find(x => x.id === tid);
    if (t) setDone(p, t, cb.checked);
  }
  render();
});

document.addEventListener("click", e => {
  const chip = e.target.closest(".chip[data-phase], .cm-card[data-phase]");
  if (!chip) return;
  state.phaseOverride = chip.dataset.phase;
  saveState();
  render();
});

$("btnReset").addEventListener("click", () => {
  if (confirm("确认清空全部打卡进度？此操作不可撤销。")) {
    state.phaseOverride = null; state.done = {};
    localStorage.removeItem(LS_KEY);
    render();
  }
});

/* ================= 跨设备同步（进度码） ================= */
$("btnExport").addEventListener("click", () => {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, phaseOverride: state.phaseOverride, done: state.done }))));
  const ta = document.createElement("textarea");
  ta.value = code; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (err) {}
  ta.remove();
  prompt(ok ? "进度码已复制，到另一台设备点「导入进度码」粘贴即可：" : "请手动全选复制下方进度码：", code);
});
$("btnImport").addEventListener("click", () => {
  const code = prompt("粘贴另一台设备导出的进度码：");
  if (!code) return;
  try {
    const s = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if (!s || typeof s !== "object" || !s.done) throw new Error("bad");
    state.phaseOverride = s.phaseOverride || null;
    state.done = s.done;
    saveState(); render();
  } catch (err) { alert("进度码无效，请重新复制完整内容"); }
});

/* ================= 启动 ================= */
loadState();
render();
</script>
</body>
</html>
